services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university_db
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP, so the check only passes once PostgreSQL accepts network connections
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "university_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/university_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_ADMIN_EMAIL: admin@uni.edu
      APP_ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data:
