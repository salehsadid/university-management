spring.application.name=university

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/university_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Initial admin (created on startup if no admin exists)
app.admin.name=Super Admin
app.admin.email=admin@uni.edu
app.admin.password=admin123
